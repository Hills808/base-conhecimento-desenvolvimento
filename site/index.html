<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before the first paint, including direct lesson links.
      (function () {
        var preference = "system";
        try {
          var saved = localStorage.getItem("curva-aberta-theme-v1");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch (_) {}
        var theme = preference === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#151c2a" : "#f4f6fb";
      })();
    </script>
    <meta name="description" content="Curva Aberta: dez módulos, três níveis e centenas de recursos para estudar e praticar tecnologia." />
    <title>Curva Aberta — Aprenda fazendo</title>
    <link rel="icon" type="image/svg+xml" href="/base-conhecimento-desenvolvimento/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

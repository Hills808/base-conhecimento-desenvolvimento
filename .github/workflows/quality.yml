name: Validar conteúdo

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Validar Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Verificar links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --verbose
            --no-progress
            --output ./lychee-out.md
            "**/*.md"
          fail: true
          jobSummary: true

      - name: Criar issue em falha agendada
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Links quebrados detectados pela verificação automática"
          content-filepath: ./lychee-out.md

name: Validar primeiras práticas
on:
  push:
    branches: [main]
    paths: ['site/src/data/formation.ts', 'site/scripts/test-formation-examples.mjs', 'site/public/formacao/**', '.github/workflows/formation.yml']
  pull_request:
    paths: ['site/src/data/formation.ts', 'site/scripts/test-formation-examples.mjs', 'site/public/formacao/**', '.github/workflows/formation.yml']
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: node scripts/test-formation-examples.mjs
        working-directory: site
      - name: Conferir kit HTTP
        working-directory: site/public/formacao
        run: |
          python -c "import zipfile,pathlib; z=zipfile.ZipFile('mesa-http.zip'); [(_ for _ in ()).throw(AssertionError(n)) for n in z.namelist() if z.read(n)!=pathlib.Path(n).read_bytes()]"
          python servidor.py > /tmp/mesa-http.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5080/solicitacoes/1 > /dev/null; then break; fi
            sleep 1
          done
          python verificar.py

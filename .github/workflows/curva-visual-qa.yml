name: Conferir o visual no site publicado
on:
  push:
    branches: [codex/curva-visual-estudo]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar o Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps --only-shell chromium
      - name: Conferir site publicado
        working-directory: site
        run: python scripts/qa-visual-preview.py

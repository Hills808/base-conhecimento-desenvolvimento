name: Validar kit local .NET
on:
  push:
    branches: [main]
    paths: ["site/public/lab/kit-local/**", ".github/workflows/lab-local.yml"]
  pull_request:
    paths: ["site/public/lab/kit-local/**", ".github/workflows/lab-local.yml"]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/public/lab/kit-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: site/public/lab/kit-local/global.json
      - run: python ../../../scripts/package-lab.py --check
      - run: dotnet build ApiPerfil && dotnet build PerfilMcp && dotnet build VerificarMcp
      - name: Testar MCP e recuperação
        run: dotnet run --project VerificarMcp && dotnet run --project RagLocal
      - name: Testar API com fixtures
        run: |
          dotnet run --no-build --project ApiPerfil --urls http://127.0.0.1:5080 > /tmp/curva-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health > /dev/null; then break; fi
            sleep 1
          done
          dotnet run --project VerificarApi

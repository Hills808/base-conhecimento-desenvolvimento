name: Conferir o Curva Aberta publicado
on:
  push:
    branches: [codex/curva-formacao-26-11]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador de teste
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps --only-shell chromium
      - name: Navegar na publicação
        working-directory: site
        run: python scripts/qa-guided-preview.py

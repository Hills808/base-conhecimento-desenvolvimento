name: Conferir vídeos da trilha
on:
  push:
    branches: [codex/conferir-videos-da-trilha]
permissions:
  contents: read
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps --only-shell chromium
          python site/scripts/qa-video-preview.py

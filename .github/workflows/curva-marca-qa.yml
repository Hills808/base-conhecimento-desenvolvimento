name: Conferir a marca no site publicado
on:
  push:
    branches: [codex/curva-identidade-visual]
permissions:
  contents: read
jobs:
  publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CURVA_PUBLIC_URL: "https://hills808.github.io/base-conhecimento-desenvolvimento/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar o navegador
        run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps --only-shell chromium
      - name: Conferir identidade no GitHub Pages
        working-directory: site
        run: python scripts/qa-brand.py
